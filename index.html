<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Weekly Decisions | Max Weberman</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Khand:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<header class="top"><div class="bar"><span class="wordmark">MAX WEBERMAN</span>
  <div class="bar-right"><button id="connect" class="btn sm mw-hover">Connect Dropbox</button><button id="demo" class="btn sm mw-hover">Demo Mode</button></div></div></header>
<main class="deck">
  <div class="head"><h1 id="heading">Weekly Decisions</h1><p class="muted"><span id="week"></span> · <span id="mode"></span> · <span id="progress"></span></p>
    <div class="track"><div id="bar" class="fill"></div></div></div>
  <p id="msg" class="muted" role="status"></p>
  <section id="stack" class="stack" aria-live="polite"></section>
  <p class="hint muted" id="hint">← No · Yes →</p>
  <div id="controls" class="controls">
    <div class="row">
      <button class="btn ans no mw-hover" data-a="no">No</button>
      <button class="btn ans maybe mw-hover" data-a="maybe">Maybe</button>
      <button class="btn ans love mw-hover" data-a="love"><span class="heart" aria-hidden="true">♥</span> Love</button>
      <button class="btn ans yes mw-hover" data-a="yes">Yes</button>
    </div>
    <button id="skip" class="skip mw-hover">Skip</button>
  </div>
  <section id="results" hidden>
    <div class="reshead"><h2>Results</h2>
      <label class="label sortlbl">Sort <select id="sort" aria-label="Sort Results"><option value="az">Title A-Z</option><option value="za">Title Z-A</option><option value="answer">Answer</option><option value="owner">Owner</option></select></label></div>
    <p id="summary" class="muted"></p>
    <div id="list" class="list"></div>
    <div class="resbtns"><button id="sync" class="btn sm mw-hover">Sync</button><button id="copy" class="btn sm mw-hover">Copy Results</button><button id="export" class="btn sm mw-hover">Export JSON</button><button id="restart" class="btn sm mw-hover">Review Skipped</button></div>
  </section>
</main>
<div class="sharebar"><button id="share" class="btn share mw-hover" aria-label="Share Decisions">Share</button></div>
<footer class="foot">MAX WEBERMAN · Weekly Decisions</footer>
<script src="config.js"></script><script src="app.js"></script>
<!-- mw-built-footer -->
<style>.mw-built{display:block;clear:both;width:100%;box-sizing:border-box;margin:0;padding:14px 16px calc(14px + var(--mw-built-pad,0px) + env(safe-area-inset-bottom,0px));background:#fafaf8;text-align:center;font-family:Hind,system-ui,sans-serif;font-size:12px;line-height:1.4;color:#8a8a8a;position:relative;z-index:1}.mw-built a{color:#8a8a8a;text-decoration:none;transition:color .15s,opacity .15s}.mw-built a.mw-hover:hover,.mw-built a:focus-visible{color:#555;text-decoration:underline}</style>
<footer class="mw-built"><a class="mw-hover" href="https://maxweberman.com" target="_blank" rel="noopener">Built by Max Weberman</a></footer>
<script>(function(){var r=document.documentElement;function m(){var ft=document.querySelector('.mw-built'),h=0,vh=innerHeight;if(!ft)return;document.querySelectorAll('body *').forEach(function(e){if(ft.contains(e))return;var s=getComputedStyle(e);if((s.position=='fixed'||s.position=='sticky')&&s.display!='none'&&s.visibility!='hidden'){var b=e.getBoundingClientRect();if(b.height>0&&b.height<vh*.5&&b.bottom>=vh-2&&b.top>vh*.5)h=Math.max(h,vh-b.top)}});r.style.setProperty('--mw-built-pad',Math.ceil(h)+'px')}addEventListener('load',m);addEventListener('resize',m);setTimeout(m,600);setTimeout(m,2000)})();</script>
<!-- /mw-built-footer -->
</body></html>
